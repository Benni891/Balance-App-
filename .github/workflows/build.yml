name: APK bauen
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir proj && unzip -q projekt.zip -d proj
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Android-Lizenzen bestaetigen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: APK bauen
        run: gradle assembleDebug --no-daemon
        working-directory: proj
      - name: Release mit APK erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk Balance.apk
          gh release create "v${{ github.run_number }}" Balance.apk --title "Balance ${{ github.run_number }}" --notes "Direkt installierbare APK"
